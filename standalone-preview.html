<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware 101 - Hero Section Preview</title>
    <style>
/* Hardware 101 Hero Section - Standalone Version */

*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg-primary: #000000;
    --text-primary: #ffffff;
    --text-secondary: #cccccc;
    --accent-color: #00ffaa;
    --grid-color: rgba(255, 255, 255, 0.1);
    --trace-color: rgba(255, 255, 255, 0.8);
    --symbol-color: rgba(255, 255, 255, 0.3);
    --glow-color: rgba(0, 255, 170, 0.6);
}

html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    overflow-x: hidden;
}

.hero-section {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: var(--bg-primary);
}

.animation-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
}

.circuit-traces {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0.6;
    z-index: 1;
}

.circuit-trace {
    stroke: var(--trace-color);
    stroke-width: 1;
    fill: none;
    opacity: 0;
    animation: traceGlow 8s ease-in-out infinite;
}

.circuit-node {
    fill: var(--accent-color);
    opacity: 0.8;
    animation: nodePulse 3s ease-in-out infinite;
}

@keyframes traceGlow {
    0%, 100% { opacity: 0; stroke-width: 1; }
    50% { opacity: 0.8; stroke-width: 1.5; }
}

@keyframes nodePulse {
    0%, 100% { opacity: 0.8; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.2); filter: drop-shadow(0 0 8px var(--glow-color)); }
}

.symbol-cloud {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    opacity: 0.4;
}

.electrical-symbol {
    position: absolute;
    color: var(--symbol-color);
    font-size: 24px;
    opacity: 0;
    animation: symbolFloat 12s ease-in-out infinite;
    user-select: none;
}

@keyframes symbolFloat {
    0%, 100% { 
        opacity: 0; 
        transform: translateY(0px) rotate(0deg); 
    }
    25% { 
        opacity: 0.6; 
        transform: translateY(-20px) rotate(5deg); 
    }
    75% { 
        opacity: 0.6; 
        transform: translateY(-10px) rotate(-5deg); 
    }
}

.waveform-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 3;
    opacity: 0.3;
}

.chip-grid {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    background-image: 
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px),
        linear-gradient(var(--grid-color) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.2;
    animation: gridShift 20s ease-in-out infinite;
}

.chip-grid::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-image: 
        radial-gradient(circle at 20px 20px, var(--grid-color) 1px, transparent 1px);
    background-size: 80px 80px;
    opacity: 0.5;
    animation: gridShift 25s ease-in-out infinite reverse;
}

@keyframes gridShift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(10px, 10px) scale(1.05); }
}

.logic-gates {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 4;
    opacity: 0.3;
}

.logic-gate {
    position: absolute;
    color: var(--text-secondary);
    font-size: 18px;
    opacity: 0;
    animation: gateFade 10s ease-in-out infinite;
    user-select: none;
}

@keyframes gateFade {
    0%, 100% { opacity: 0; transform: scale(0.8); }
    50% { opacity: 0.7; transform: scale(1); }
}

.particle-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
    opacity: 0.6;
}

.hero-content {
    position: relative;
    z-index: 10;
    text-align: center;
    max-width: 800px;
    padding: 0 2rem;
}

.hero-text {
    animation: contentFadeIn 1.5s ease-out;
}

@keyframes contentFadeIn {
    0% { opacity: 0; transform: translateY(30px); }
    100% { opacity: 1; transform: translateY(0); }
}

.hero-title {
    font-size: clamp(3rem, 8vw, 6rem);
    font-weight: 300;
    line-height: 1.1;
    margin-bottom: 1.5rem;
    letter-spacing: -0.02em;
}

.title-main {
    color: var(--text-primary);
    display: inline-block;
}

.title-accent {
    color: var(--accent-color);
    font-weight: 600;
    display: inline-block;
    margin-left: 0.5rem;
    text-shadow: 0 0 20px var(--glow-color);
    animation: titleGlow 4s ease-in-out infinite;
}

@keyframes titleGlow {
    0%, 100% { text-shadow: 0 0 20px var(--glow-color); }
    50% { text-shadow: 0 0 30px var(--glow-color), 0 0 40px var(--glow-color); }
}

.hero-subtitle {
    font-size: clamp(1.125rem, 2.5vw, 1.5rem);
    font-weight: 400;
    color: var(--text-secondary);
    margin-bottom: 3rem;
    line-height: 1.4;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
}

.cta-button {
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem 2rem;
    background: transparent;
    border: 2px solid var(--text-primary);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 1.125rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    position: relative;
    overflow: hidden;
}

.cta-button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: var(--accent-color);
    transition: left 0.3s ease;
    z-index: -1;
}

.cta-button:hover {
    color: var(--bg-primary);
    border-color: var(--accent-color);
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0, 255, 170, 0.3);
}

.cta-button:hover::before {
    left: 0;
}

.cta-arrow {
    width: 20px;
    height: 20px;
    transition: transform 0.3s ease;
}

.cta-button:hover .cta-arrow {
    transform: translateX(4px);
}

@media (max-width: 768px) {
    .hero-content { padding: 0 1rem; }
    .electrical-symbol { font-size: 18px; }
    .logic-gate { font-size: 14px; }
    .chip-grid { background-size: 30px 30px; }
    .chip-grid::before { background-size: 60px 60px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
    .animation-container { display: none; }
}
    </style>
</head>
<body>
    <main class="hero-section">
        <div class="animation-container">
            <svg class="circuit-traces" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
                <!-- Circuit traces will be generated by JavaScript -->
            </svg>
            <div class="symbol-cloud"></div>
            <canvas class="waveform-canvas"></canvas>
            <div class="chip-grid"></div>
            <div class="logic-gates"></div>
            <canvas class="particle-canvas"></canvas>
        </div>

        <div class="hero-content">
            <div class="hero-text">
                <h1 class="hero-title">
                    <span class="title-main">hardware</span>
                    <span class="title-accent">101</span>
                </h1>
                <p class="hero-subtitle">
                    Learn Electronics, Embedded Systems & VLSI — From Scratch.
                </p>
                <button class="cta-button">
                    <span>Start Learning</span>
                    <svg class="cta-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>
        </div>
    </main>

    <script>
// Simplified Hardware Animation for Standalone Preview
class SimpleHardwareAnimation {
    constructor() {
        this.init();
    }
    
    init() {
        this.setupCanvases();
        this.createCircuitTraces();
        this.createElectricalSymbols();
        this.createLogicGates();
        this.initWaveforms();
        this.initParticles();
        this.startAnimation();
    }
    
    setupCanvases() {
        this.waveformCanvas = document.querySelector('.waveform-canvas');
        this.waveformCtx = this.waveformCanvas.getContext('2d');
        this.particleCanvas = document.querySelector('.particle-canvas');
        this.particleCtx = this.particleCanvas.getContext('2d');
        this.resizeCanvases();
        window.addEventListener('resize', () => this.resizeCanvases());
    }
    
    resizeCanvases() {
        const rect = document.querySelector('.hero-section').getBoundingClientRect();
        [this.waveformCanvas, this.particleCanvas].forEach(canvas => {
            canvas.width = rect.width;
            canvas.height = rect.height;
        });
    }
    
    createCircuitTraces() {
        const svg = document.querySelector('.circuit-traces');
        const traceCount = 8;
        
        for (let i = 0; i < traceCount; i++) {
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            const pathData = this.generateTracePath();
            path.setAttribute('d', pathData);
            path.setAttribute('class', 'circuit-trace');
            path.style.animationDelay = `${i * 0.5}s`;
            svg.appendChild(path);
            
            // Add nodes
            const coords = pathData.match(/[\d.]+/g);
            if (coords) {
                for (let j = 0; j < coords.length; j += 2) {
                    if (Math.random() < 0.3) {
                        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                        circle.setAttribute('cx', coords[j]);
                        circle.setAttribute('cy', coords[j + 1]);
                        circle.setAttribute('r', '3');
                        circle.setAttribute('class', 'circuit-node');
                        circle.style.animationDelay = `${i * 0.3 + j * 0.1}s`;
                        svg.appendChild(circle);
                    }
                }
            }
        }
    }
    
    generateTracePath() {
        const startX = Math.random() * 1920;
        const startY = Math.random() * 1080;
        let pathData = `M ${startX} ${startY}`;
        let currentX = startX;
        let currentY = startY;
        
        for (let i = 0; i < 4; i++) {
            const direction = Math.random() < 0.5 ? 'H' : 'V';
            if (direction === 'H') {
                currentX += (Math.random() - 0.5) * 400;
                currentX = Math.max(0, Math.min(1920, currentX));
                pathData += ` H ${currentX}`;
            } else {
                currentY += (Math.random() - 0.5) * 300;
                currentY = Math.max(0, Math.min(1080, currentY));
                pathData += ` V ${currentY}`;
            }
        }
        return pathData;
    }
    
    createElectricalSymbols() {
        const container = document.querySelector('.symbol-cloud');
        const symbols = ['⟟', '⟘', '∿', '⟜', '⟝', '⟞', '⊞', '⊟', '⊠', '◊', '◈'];
        
        for (let i = 0; i < 15; i++) {
            const symbol = document.createElement('div');
            symbol.className = 'electrical-symbol';
            symbol.textContent = symbols[Math.floor(Math.random() * symbols.length)];
            symbol.style.left = Math.random() * 100 + '%';
            symbol.style.top = Math.random() * 100 + '%';
            symbol.style.animationDelay = Math.random() * 12 + 's';
            container.appendChild(symbol);
        }
    }
    
    createLogicGates() {
        const container = document.querySelector('.logic-gates');
        const gates = ['AND', 'OR', 'NOT', 'XOR', 'NAND', 'NOR'];
        
        for (let i = 0; i < 8; i++) {
            const gate = document.createElement('div');
            gate.className = 'logic-gate';
            gate.textContent = gates[Math.floor(Math.random() * gates.length)];
            gate.style.left = Math.random() * 100 + '%';
            gate.style.top = Math.random() * 100 + '%';
            gate.style.animationDelay = Math.random() * 10 + 's';
            container.appendChild(gate);
        }
    }
    
    initWaveforms() {
        this.waveforms = [
            { type: 'sine', amplitude: 30, frequency: 0.02, phase: 0, speed: 1, y: 0.3, color: 'rgba(255, 255, 255, 0.4)' },
            { type: 'square', amplitude: 20, frequency: 0.015, phase: Math.PI, speed: 0.8, y: 0.7, color: 'rgba(0, 255, 170, 0.3)' }
        ];
    }
    
    initParticles() {
        this.particles = [];
        for (let i = 0; i < 25; i++) {
            this.particles.push(this.createParticle());
        }
    }
    
    createParticle() {
        return {
            x: Math.random() * this.particleCanvas.width,
            y: Math.random() * this.particleCanvas.height,
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.5,
            size: Math.random() * 2 + 1,
            opacity: Math.random() * 0.8 + 0.2,
            life: Math.random() * 300 + 100,
            maxLife: 400
        };
    }
    
    animate() {
        const time = Date.now() * 0.001;
        
        // Draw waveforms
        const wCtx = this.waveformCtx;
        wCtx.clearRect(0, 0, this.waveformCanvas.width, this.waveformCanvas.height);
        
        this.waveforms.forEach(waveform => {
            wCtx.strokeStyle = waveform.color;
            wCtx.lineWidth = 1;
            wCtx.beginPath();
            
            for (let x = 0; x < this.waveformCanvas.width; x += 4) {
                const phase = waveform.phase + x * waveform.frequency + time * waveform.speed;
                let y = this.waveformCanvas.height * waveform.y;
                
                if (waveform.type === 'sine') {
                    y += Math.sin(phase) * waveform.amplitude;
                } else {
                    y += (Math.sin(phase) > 0 ? 1 : -1) * waveform.amplitude;
                }
                
                if (x === 0) wCtx.moveTo(x, y);
                else wCtx.lineTo(x, y);
            }
            wCtx.stroke();
        });
        
        // Draw particles
        const pCtx = this.particleCtx;
        pCtx.clearRect(0, 0, this.particleCanvas.width, this.particleCanvas.height);
        
        this.particles.forEach((particle, i) => {
            particle.x += particle.vx;
            particle.y += particle.vy;
            particle.life--;
            particle.opacity = particle.life / particle.maxLife;
            
            if (particle.x < 0) particle.x = this.particleCanvas.width;
            if (particle.x > this.particleCanvas.width) particle.x = 0;
            if (particle.y < 0) particle.y = this.particleCanvas.height;
            if (particle.y > this.particleCanvas.height) particle.y = 0;
            
            if (particle.life <= 0) {
                this.particles[i] = this.createParticle();
            }
            
            pCtx.fillStyle = `rgba(0, 255, 170, ${particle.opacity})`;
            pCtx.beginPath();
            pCtx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
            pCtx.fill();
        });
        
        requestAnimationFrame(() => this.animate());
    }
    
    startAnimation() {
        this.animate();
    }
}

// Initialize when page loads
document.addEventListener('DOMContentLoaded', () => {
    new SimpleHardwareAnimation();
    
    // Button interaction
    document.querySelector('.cta-button').addEventListener('click', (e) => {
        e.preventDefault();
        alert('🚀 Welcome to Hardware 101! Your learning journey starts here.');
    });
});
    </script>
</body>
</html>
