<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware 101 - Learn Electronics, Embedded Systems & VLSI</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="hero-section">
        <!-- Animation Background Layers -->
        <div class="animation-container">
            <!-- Layer 1: Circuit Trace Layer -->
            <svg class="circuit-traces" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
                <defs>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                        <feMerge> 
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                    <linearGradient id="traceGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" style="stop-color:rgba(255,255,255,0);stop-opacity:0" />
                        <stop offset="50%" style="stop-color:rgba(255,255,255,0.8);stop-opacity:1" />
                        <stop offset="100%" style="stop-color:rgba(255,255,255,0);stop-opacity:0" />
                    </linearGradient>
                </defs>
                <!-- Circuit traces will be generated by JavaScript -->
            </svg>

            <!-- Layer 2: Electrical Symbol Cloud -->
            <div class="symbol-cloud">
                <!-- Symbols will be generated by JavaScript -->
            </div>

            <!-- Layer 3: Oscilloscope Waveform Layer -->
            <canvas class="waveform-canvas"></canvas>

            <!-- Layer 4: Microchip Grid Pattern -->
            <div class="chip-grid">
                <!-- Grid pattern will be generated by CSS and enhanced by JS -->
            </div>

            <!-- Layer 5: Logic Gate Symbols -->
            <div class="logic-gates">
                <!-- Logic gates will be generated by JavaScript -->
            </div>

            <!-- Layer 6: Data Flow Particles -->
            <canvas class="particle-canvas"></canvas>
        </div>

        <!-- Hero Content -->
        <div class="hero-content">
            <div class="hero-text">
                <h1 class="hero-title">
                    <span class="title-main">hardware</span>
                    <span class="title-accent">101</span>
                </h1>
                <p class="hero-subtitle">
                    Learn Electronics, Embedded Systems & VLSI — From Scratch.
                </p>
                <button class="cta-button">
                    <span>Start Learning</span>
                    <svg class="cta-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
